<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Трекер пульса</title>

    <!-- Красивые шрифты -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Pacifico&display=swap" rel="stylesheet">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family: 'Montserrat', sans-serif;

            background:
                radial-gradient(circle at top, #f5fff9 0%, #e2f8ea 45%, #ccefd9 100%);

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        /* Главная карточка */

        .container {
            width: 100%;
            max-width: 500px;

            background: rgba(255, 255, 255, 0.96);

            border-radius: 32px;

            padding: 30px 25px 35px;

            text-align: center;

            box-shadow:
                0 20px 50px rgba(24, 120, 70, 0.15),
                inset 0 0 30px rgba(255, 255, 255, 0.7);
        }


        /* Заголовок */

        h1 {
            margin: 0;

            font-family: 'Pacifico', cursive;

            font-size: 44px;

            color: #18a957;

            text-shadow:
                0 3px 10px rgba(24, 169, 87, 0.18);
        }

        .subtitle {
            margin-top: 8px;
            margin-bottom: 10px;

            color: #718096;

            font-size: 14px;
        }


        /* Кардиограмма */

        .ecg {
            width: 100%;
            height: 45px;

            margin: 0 auto 5px;

            overflow: hidden;
        }

        .ecg svg {
            width: 100%;
            height: 100%;
        }

        .ecg-line {
            fill: none;
            stroke: #27c96f;
            stroke-width: 3;

            stroke-linecap: round;
            stroke-linejoin: round;

            stroke-dasharray: 500;
            stroke-dashoffset: 500;

            animation: ecgMove 2s linear infinite;
        }

        @keyframes ecgMove {

            to {
                stroke-dashoffset: 0;
            }

        }


        /* Сердце */

        .heart-area {
            height: 260px;

            display: flex;
            justify-content: center;
            align-items: center;

            position: relative;
        }

        .heart {
            width: 210px;
            height: 220px;

            animation: heartBeat 1.1s infinite ease-in-out;

            filter:
                drop-shadow(0 12px 15px rgba(180, 40, 40, 0.18));
        }

        @keyframes heartBeat {

            0% {
                transform: scale(1);
            }

            15% {
                transform: scale(1.05);
            }

            30% {
                transform: scale(1);
            }

            45% {
                transform: scale(1.07);
            }

            60% {
                transform: scale(1);
            }

            100% {
                transform: scale(1);
            }

        }


        /* Зелёная линия под сердцем */

        .heart-line {
            width: 75%;
            height: 5px;

            margin: -5px auto 25px;

            border-radius: 50%;

            background: linear-gradient(
                90deg,
                transparent,
                #27d970,
                transparent
            );

            box-shadow:
                0 0 12px rgba(39, 217, 112, 0.5);
        }


        /* Результат */

        .result {
            background: linear-gradient(
                135deg,
                #f2fff7,
                #e8fff0
            );

            border: 2px solid #a5efc2;
}

            margin-bottom: 22px;

            box-shadow:
                0 8px 25px rgba(34, 197, 94, 0.08);
        }

        .result-title {
            color: #718096;

            font-size: 14px;

            font-weight: 600;

            margin-bottom: 4px;
        }

        .bpm {
            font-size: 52px;

            font-weight: 800;

            color: #16b85a;

            line-height: 1.1;
        }

        .bpm span {
            font-size: 17px;

            color: #667085;

            font-weight: 600;
        }


        /* Кнопка */

        button {
            width: 100%;

            border: none;

            border-radius: 20px;

            padding: 18px;

            background: linear-gradient(
                135deg,
                #39e879,
                #16c75a
            );

            color: white;

            font-family: 'Montserrat', sans-serif;

            font-size: 18px;

            font-weight: 800;

            cursor: pointer;

            box-shadow:
                0 8px 25px rgba(22, 199, 90, 0.35),
                inset 0 1px 2px rgba(255,255,255,0.5);

            transition: all 0.2s ease;
        }

        button:hover {

            background: linear-gradient(
                135deg,
                #4bf486,
                #13b951
            );

            transform: translateY(-3px);

            box-shadow:
                0 12px 32px rgba(22, 199, 90, 0.45);
        }

        button:active {

            transform: scale(0.97);

            box-shadow:
                0 5px 15px rgba(22, 199, 90, 0.3);
        }


        /* Статус */

        #status {

            margin-top: 16px;

            min-height: 22px;

            color: #718096;

            font-size: 13px;

            font-weight: 500;
        }


        /* Нижний текст */

        .info {

            margin-top: 25px;

            color: #a0aec0;

            font-size: 11px;

            line-height: 1.6;
        }


        /* SVG сердце */

        .heart-body {
            fill: #ef5350;
            stroke: #202020;
            stroke-width: 4;
            stroke-linejoin: round;
        }

        .heart-dark {
            fill: #d93636;
            stroke: #202020;
            stroke-width: 3;
        }

        .heart-blue {
            fill: #51b9e8;
            stroke: #202020;
            stroke-width: 4;
            stroke-linejoin: round;
        }

        .heart-light {
            fill: #79cef0;
            stroke: #202020;
            stroke-width: 3;
        }

        .heart-vein {
            fill: none;
            stroke: #202020;
            stroke-width: 4;
            stroke-linecap: round;
        }


        /* Телефон */

        @media (max-width: 450px) {

            body {
                padding: 12px;
            }

            .container {
                padding: 25px 17px 30px;

                border-radius: 28px;
            }

            h1 {
                font-size: 37px;
            }

            .heart-area {
                height: 235px;
            }

            .heart {
                width: 185px;
                height: 200px;
            }

            .bpm {
                font-size: 46px;
            }

            button {
                font-size: 17px;
                padding: 17px;
            }
        }

    </style>
</head>

    <!-- Результат -->

        <div class="bpm">

            <span>

    <!-- Кнопка -->

    <button onclick="measurePulse()">
        ❤️ Измерить пульс
    </button>


    <!-- Статус -->

    <div id="status">
        Нажми кнопку, чтобы начать измерение
    </div>


    <!-- Предупреждение -->

    <div class="info">

        Данный сайт предназначен только для демонстрации
        и не заменяет медицинское измерение.

    </div>

</div>


<script>

    function measurePulse() {

        const pulseElement =
            document.getElementById("pulse");

        const statusElement =
            document.getElementById("status");


        statusElement.textContent =
            "Измеряем пульс...";

        pulseElement.textContent =
            "...";


        setTimeout(function () {

            /*
             * Демонстрационное значение.
             * Позже сюда можно подключить
             * настоящее измерение через камеру.
             */

            const pulse =
                Math.floor(
                    Math.random() * (90 - 65 + 1)
                ) + 65;


            pulseElement.textContent =
                pulse;


            statusElement.textContent =
                "Измерение завершено ❤️";

        }, 1500);

    }

</script>
