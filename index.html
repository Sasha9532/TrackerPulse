<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Трекер пульса</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            background: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .container {
            max-width: 400px;
            margin: 30px auto;
        }

        h1 {
            font-family: "Times New Roman", Times, serif;
            font-size: 28px;
            margin-bottom: 20px;
        }

        /* КАРДИОГРАММА НАД СЕРДЦЕМ */

        .ecg {
            width: 100%;
            max-width: 400px;
            height: 90px;
            margin: 0 auto 5px;
            overflow: hidden;
            position: relative;
        }

        .ecg svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        .ecg-line {
            fill: none;
            stroke: #39b54a;
            stroke-width: 4;
            stroke-linecap: round;
            stroke-linejoin: round;

            stroke-dasharray: 800;
            stroke-dashoffset: 800;

            animation: ecgMove 1.5s linear infinite;
        }

        @keyframes ecgMove {
            0% {
                stroke-dashoffset: 800;
            }

            100% {
                stroke-dashoffset: 0;
            }
        }

        /* СЕРДЦЕ */

        .heart {
            font-size: 58px;
            margin: 0 0 20px;
            animation: heartbeat 1.5s infinite;
        }

        @keyframes heartbeat {
            0% {
                transform: scale(1);
            }

            10% {
                transform: scale(1.12);
            }

            20% {
                transform: scale(1);
            }

            100% {
                transform: scale(1);
            }
        }

        label {
            display: block;
            text-align: left;
            margin-bottom: 8px;
            font-size: 16px;
        }

        select,
        input {
            width: 100%;
            height: 48px;
            padding: 0 12px;
            margin-bottom: 18px;

            background: white;
            color: black;

            border: 1px solid #ccc;
            border-radius: 10px;

            font-size: 16px;
        }

        button {
            width: 100%;
            height: 52px;

            border: none;
            border-radius: 10px;

            background: #b8e0c2;
            color: white;

            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        #result {
            margin-top: 25px;
            font-size: 28px;
            font-weight: bold;
            color: red;
            min-height: 35px;
        }

        #timer {
            margin-top: 10px;
            font-size: 18px;
            color: #555;
            min-height: 25px;
        }

        #advice {
            margin-top: 20px;
            font-size: 16px;
            line-height: 1.5;
            color: #333;
        }

        .advice-title {
            font-weight: bold;
            margin-bottom: 8px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>❤️ Трекер пульса</h1>

    <!-- КАРДИОГРАММА -->
    <div class="ecg">
        <svg viewBox="0 0 800 100" xmlns="http://www.w3.org/2000/svg">

            <polyline
                class="ecg-line"
                points="
                0,55
                80,55
                110,55
                125,48
                140,55
                155,55
                170,55
                185,20
                200,88
                215,55
                235,55
                270,55
                300,55
                330,55

                350,55
                365,48
                380,55
                395,55
                410,55
                425,20
                440,88
                455,55
                475,55
                510,55
                540,55
                570,55

                590,55
                605,48
                620,55
                635,55
                650,55
                665,20
                680,88
                695,55
                715,55
                750,55
                800,55
                "
            />

        </svg>
    </div>


    <!-- АНАТОМИЧЕСКОЕ СЕРДЦЕ -->
    <div class="heart">🫀</div>


    <label for="gender">Выберите гендер:</label>

    <select id="gender">
        <option value="">Выберите</option>
        <option value="male">Мужской</option>
        <option value="female">Женский</option>
    </select>


    <label for="weight">Введите вес:</label>

    <input
        type="number"
        id="weight"
        placeholder="Вес в кг"
        min="1"
    >


    <button onclick="measurePulse()">
        Измерить
    </button>


    <div id="timer"></div>

    <div id="result">—</div>

    <div id="advice"></div>

</div>


<script>

function randomNumber(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
}


function getPulse(gender, weight) {

    weight = Number(weight);


    // МУЖСКОЙ
    if (gender === "male") {

        if (weight >= 40 && weight < 60) {
            return 170;
        }

        if (weight >= 60 && weight < 70) {
            return 160;
        }

        if (weight >= 70 && weight < 80) {
            return randomNumber(150, 165);
        }

        if (weight >= 80) {
            return randomNumber(120, 165);
        }
    }


    // ЖЕНСКИЙ
    if (gender === "female") {

        if (weight >= 40 && weight < 60) {
            return 180;
        }

        if (weight >= 60 && weight <= 100) {
            return randomNumber(140, 180);
        }
    }


    return null;
}


function measurePulse() {

    const gender = document.getElementById("gender").value;
    const weight = document.getElementById("weight").value;

    const result = document.getElementById("result");
    const timer = document.getElementById("timer");
    const advice = document.getElementById("advice");


    if (!gender) {

        result.textContent = "Выберите гендер.";
        timer.textContent = "";
        advice.textContent = "";

        return;
    }


    if (!weight) {

        result.textContent = "Введите вес.";
        timer.textContent = "";
        advice.textContent = "";

        return;
    }


    const pulse = getPulse(gender, weight);


    if (pulse === null) {

        result.textContent = "Для указанного веса нет значения.";
        timer.textContent = "";
        advice.textContent = "";

        return;
    }


    result.textContent = "—";
    advice.textContent = "";

    let seconds = 15;

    timer.textContent = "Измерение... 15 сек.";


    const interval = setInterval(function() {

        seconds--;

        if (seconds > 0) {

            timer.textContent =
                "Измерение... " + seconds + " сек.";

        } else {

            clearInterval(interval);

            timer.textContent = "Измерение завершено";

            result.textContent = pulse;

            showAdvice(pulse);
        }

    }, 1000);
}


function showAdvice(pulse) {

    const advice = document.getElementById("advice");


    const tips = [

        "Сделайте несколько спокойных вдохов и постарайтесь расслабиться.",

        "Если вы недавно двигались или занимались спортом, немного отдохните.",

        "Постарайтесь выспаться и дать организму достаточно времени на восстановление.",

        "В течение дня не забывайте пить воду.",

        "Если вы чувствуете себя плохо, остановитесь и отдохните.",

        "Не перенапрягайтесь и делайте небольшие перерывы в течение дня.",

        "Старайтесь сохранять спокойствие и избегать лишнего стресса.",
        "После нагрузки дайте своему организму время восстановиться."
    ];


    const randomTip =
        tips[Math.floor(Math.random() * tips.length)];


    advice.innerHTML =
        '<div class="advice-title">Вы волнуетесь, совет который вам поможет:</div>' +
        randomTip;
}

</script>

</body>
</html>
