<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Трекер пульса</title>
<style>
    * {
        box-sizing: border-box;
    }
    body {
        margin: 0;
        min-height: 100vh;
        background: linear-gradient(135deg, #f5f7f8, #e9f5ef);
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }
    .container {
        width: 100%;
        max-width: 420px;
        background: white;
        padding: 32px 26px;
        border-radius: 24px;
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.08);
        text-align: center;
    }
    h1 {
        margin: 0;
        color: #202020;
        font-size: 30px;
    }
    .subtitle {
        margin-top: 8px;
        margin-bottom: 30px;
        color: #888;
        font-size: 14px;
    }
    .field {
        text-align: left;
        margin-bottom: 20px;
    }
    label {
        display: block;
        margin-bottom: 8px;
        color: #222;
        font-size: 15px;
        font-weight: bold;
    }
    select,
    input {
        width: 100%;
        height: 50px;
        padding: 0 15px;
        background: #fafafa;
        color: #222;
        border: 1px solid #ddd;
        border-radius: 12px;
        font-size: 16px;
        outline: none;
    }
    .heart {
        display: inline-block;
        margin-top: 12px;
        font-size: 48px;
    }
    .beating {
        animation: heartbeat 0.8s infinite;
    }
    @keyframes heartbeat {
        0% { transform: scale(1); }
        25% { transform: scale(1.15); }
        40% { transform: scale(1); }
        60% { transform: scale(1.15); }
        100% { transform: scale(1); }
    }
    .result {
        height: 65px;
        display: flex;
        justify-content: center;
        align-items: center;
        color: #e63946;
        font-size: 38px;
        font-weight: bold;
    }
    .result span {
        margin-left: 6px;
        font-size: 15px;
        color: #888;
        font-weight: normal;
    }
    .timer {
        height: 25px;
        margin-bottom: 10px;
        color: #999;
        font-size: 14px;
    }
    .advice {
        display: none;
        margin: 15px 0 20px;
        padding: 16px;
        background: #f4faf5;
        border-radius: 15px;
        text-align: left;
    }
    .advice.show {
        display: block;
    }
    .advice-title {
        margin-bottom: 8px;
        color: #5d9b68;
        font-size: 14px;
        font-weight: bold;
    }
    .advice-text {
        color: #555;
        font-size: 14px;
        line-height: 1.5;
    }
    button {
        width: 100%;
        height: 54px;
        border: none;
        border-radius: 14px;
        background: #b8dfc0;
        color: white;
        font-size: 17px;
        font-weight: bold;
        cursor: pointer;
    }
    button:hover {
        background: #a6d3ae;
    }
    button:disabled {
        background: #d5d5d5;
        cursor: not-allowed;
    }
</style>
</head>
<body>
<div class="container">
<h1>❤️ Трекер пульса</h1>
<div class="subtitle">
    Заполните данные для измерения
</div>
<div class="field">
    <label for="gender">Гендер</label>
    <select id="gender">
        <option value="">Выберите гендер</option>
        <option value="male">Мужской</option>
        <option value="female">Женский</option>
    </select>
</div>
<div class="field">
    <label for="weight">Вес, кг</label>
    <input
        type="number"
        id="weight"
        placeholder="Введите вес"
        min="1"
        max="300"
    >
</div>
<div class="heart" id="heart">❤️</div>
<div class="result" id="result">—</div>
<div class="timer" id="timer"></div>
<div class="advice" id="advice">
    <div class="advice-title">
        💚 Рекомендация
    </div>
    <div class="advice-text" id="adviceText"></div>
</div>
<button id="measureButton" onclick="measurePulse()">
  Измерить
</button>
</div>
<script>
const tips = [
    "Дыхание 4-7-8: вдох 4 — задержка 7 — выдох 8.",
    "Холодная вода на лицо или шею.",
    "Проба Вальсальвы: выдох с усилием при зажатом носе.",
    "Заземление 5-4-3-2-1.",
    "Короткая прогулка или немного движения."
];
function randomNumber(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
}
function getPulse(gender, weight) {
    if (gender === "male") {
        if (weight >= 40 && weight < 60)
            return 170;
        if (weight >= 60 && weight < 70)
            return 160;
        if (weight >= 70 && weight < 80)
            return randomNumber(150, 165);
        if (weight >= 80)
            return randomNumber(120, 165);
    }
    if (gender === "female") {
        if (weight >= 40 && weight < 60)
            return 180;
        if (weight >= 60 && weight <= 100)
            return randomNumber(140, 180);
    }
    return null;
}
function measurePulse() {
    const gender = document.getElementById("gender").value;
    const weight = Number(document.getElementById("weight").value);
    const result = document.getElementById("result");
    const heart = document.getElementById("heart");
    const button = document.getElementById("measureButton");
    const timer = document.getElementById("timer");
    const advice = document.getElementById("advice");
    const adviceText = document.getElementById("adviceText");
    if (gender === "") {
        alert("Выберите гендер.");
        return;
    }
    if (!weight || weight <= 0) {
        alert("Введите вес.");
        return;
    }
    const pulse = getPulse(gender, weight);
    if (pulse === null) {
        alert("Для указанного веса значение не задано.");
        return;
    }
    advice.classList.remove("show");
    result.innerHTML = "—";
    timer.innerHTML = "Измерение... 15 сек.";
    button.disabled = true;
    heart.classList.add("beating");
    let seconds = 15;
    const countdown = setInterval(function () {
        seconds--;
        timer.innerHTML =
            "Измерение... " + seconds + " сек.";
        if (seconds <= 0) {
            clearInterval(countdown);
            result.innerHTML =
                pulse + "<span>уд/мин</span>";
            timer.innerHTML =
                "Измерение завершено";
            heart.classList.remove("beating");
            button.disabled = false;
            const randomTip =
                tips[Math.floor(Math.random() * tips.length)];
            adviceText.innerHTML =
                "Если вы испытываете негативные эмоции, " +
                "вот несколько способов помочь себе " +
                "успокоиться и поддержать хорошее самочувствие:<br><br>" +
                "• " + randomTip;
            advice.classList.add("show");
        }
    }, 1000);
}
</script>
</body>
</html>
